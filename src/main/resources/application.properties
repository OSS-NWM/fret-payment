server.port=8082
spring.application.name=fret-payment

# Datasource - fretpaymentdb on port 5434
spring.datasource.url=jdbc:postgresql://localhost:5434/fretpaymentdb
spring.datasource.username=postgres
spring.datasource.password=Admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Keycloak OAuth2 (same realm as fret-management)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:9090/realms/nwm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS:http://localhost:9090/realms/nwm/protocol/openid-connect/certs}

